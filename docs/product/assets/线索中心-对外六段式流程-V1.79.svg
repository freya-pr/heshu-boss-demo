  <text x="1045" y="400" text-anchor="middle" class="d" fill="#2d63a8">分析结果反向优化归因、分配、排班、短信和运营策略</text>
  <text x="48" y="455" class="s">说明：六段用于业务讲解；线索建档后，分配、身份处理与订单同步可并行，任一阶段失败均进入可修复、可重试的异常任务。</text>
